
name: 3105 V1 - Upload IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.ipa'

permissions:
  contents: read
  actions: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find IPA files
        id: find
        run: |
          find . -type f -name "*.ipa" > ipa-list.txt

          if [ ! -s ipa-list.txt ]; then
            echo "ERROR: No se encontró ningún archivo IPA"
            exit 1
          fi

          cat ipa-list.txt

      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: 3105-V1-IPA
          path: |
            **/*.ipa
          if-no-files-found: error
          retention-days: 30
